<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проекты — Akiyama</title>
<script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="bg-glow"></div>
<div class="bg-grid"></div>

<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <svg class="logo-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M13 28 L20 12 L27 28 M16 22 L24 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">AKIYAMA</span>
    </a>

    <nav class="nav" id="nav">
      <a href="index.html" class="nav-link" data-i18n="nav_home">🏠 Главная</a>
      <a href="projects.html" class="nav-link" data-i18n="nav_projects">📁 Проекты</a>
      <a href="shop.html" class="nav-link" data-i18n="nav_shop">🛒 Магазин</a>
      <a href="reviews.html" class="nav-link" data-i18n="nav_reviews">💬 Отзывы</a>
      <a href="contacts.html" class="nav-link" data-i18n="nav_contacts">📬 Контакты</a>
      <a href="settings.html" class="nav-link" data-i18n="nav_settings">⚙️ Настройки</a>
    </nav>

    <div class="header-right">
      <button class="user-btn" id="userBtn">
        <span id="userIcon">👤</span>
        <span id="userName" data-i18n="login">Войти</span>
      </button>
      <button class="burger" id="burger">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div class="modal" id="authModal">
  <div class="modal-content">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-tabs">
      <button class="modal-tab active" data-tab="login" data-i18n="auth_tab_login">Вход</button>
      <button class="modal-tab" data-tab="register" data-i18n="auth_tab_register">Регистрация</button>
    </div>
    <form class="modal-form active" id="loginForm">
      <h2 class="modal-title" data-i18n="auth_login">🔐 Вход</h2>
      <label class="modal-label"><span data-i18n="auth_username">Логин</span>
        <input type="text" id="loginUsername" class="modal-input" required>
      </label>
      <label class="modal-label"><span data-i18n="auth_password">Пароль</span>
        <input type="password" id="loginPassword" class="modal-input" required>
      </label>
      <div class="modal-error" id="loginError"></div>
      <button type="submit" class="modal-submit" data-i18n="auth_login_btn">Войти</button>
    </form>
    <form class="modal-form" id="registerForm">
      <h2 class="modal-title" data-i18n="auth_register">📝 Регистрация</h2>
      <label class="modal-label"><span data-i18n="auth_username">Логин</span>
        <input type="text" id="regUsername" class="modal-input" required>
      </label>
      <label class="modal-label"><span data-i18n="auth_password">Пароль</span>
        <input type="password" id="regPassword" class="modal-input" required>
      </label>
      <label class="modal-label"><span data-i18n="auth_password2">Подтвердите пароль</span>
        <input type="password" id="regPassword2" class="modal-input" required>
      </label>
      <div class="modal-error" id="regError"></div>
      <button type="submit" class="modal-submit" data-i18n="auth_register_btn">Зарегистрироваться</button>
    </form>
  </div>
</div>

<main>
  <section class="projects-section">
    <div class="container">
      <h2 class="section-title" data-i18n="nav_projects">📁 Проекты</h2>
      <div class="projects-list" id="projectsList"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <p data-i18n="footer">© 2026 Akiyama · Made with 🦾</p>
  </div>
</footer>

<!-- ========== СКРИПТЫ ========== -->
<script src="js/api.js"></script>
<script src="js/posts.js"></script>
<script src="js/reviews.js"></script>
<script src="js/accounts.js"></script>
<script src="js/projects.js"></script>
<script src="js/main.js"></script>
</body>
</html>
